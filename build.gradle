plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mobileamericas'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Source set propio: los tests de integración levantan contenedores y no deben
// correr en cada './gradlew test'.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.session:spring-session-jdbc'
    // Y su autoconfiguración, que en Boot 4 vive en artefactos aparte (igual
    // que la de Flyway, más abajo): sin esto no hay SessionRepository JDBC ni
    // SessionRepositoryFilter, así que la sesión se queda en memoria de Tomcat,
    // SPRING_SESSION nunca se escribe y 'spring.session.*' no configura nada.
    implementation 'org.springframework.boot:spring-boot-session-jdbc'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    // Boot 4 modularizó la autoconfiguración: la de Flyway vive en este artefacto
    // aparte, no llega transitivamente con flyway-core ni con el starter de JPA.
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Boot 4 modularizó también el soporte de pruebas: @WebMvcTest vive en este
    // artefacto aparte y ya no llega transitivamente con spring-boot-starter-test.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    // Testcontainers 2.x (gestionado por el BOM de Spring Boot 4.1.1) renombró
    // los módulos con el prefijo 'testcontainers-'; los artefactos antiguos
    // 'junit-jupiter', 'mysql' y 'postgresql' no existen en esa versión.
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-mysql'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
    // TestRestTemplate también se modularizó: en Boot 4 vive en este artefacto
    // aparte (org.springframework.boot.resttestclient), no en spring-boot-test.
    integrationTestImplementation 'org.springframework.boot:spring-boot-resttestclient'
    // La autoconfiguración de TestRestTemplate exige un RestTemplateBuilder
    // (@ConditionalOnBean), que vive en este otro módulo aparte; sin él, la
    // comprobación de la condición revienta con ClassNotFoundException en vez
    // de simplemente no aplicarse.
    integrationTestImplementation 'org.springframework.boot:spring-boot-restclient'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed' }
}

tasks.named('bootRun') {
    // Mismo motivo que en integrationTest, y el mismo anclaje que el pod recibe
    // por JAVA_TOOL_OPTIONS y TZ (kubernetes/deployment.yaml): los TIMESTAMP(6)
    // de V3__oauth.sql no llevan zona, así que se escriben y se leen en la de
    // la JVM. Sin esta línea, arrancar en local desde una máquina que no está
    // en UTC desplaza las caducidades respecto de lo que verá producción.
    systemProperty 'user.timezone', 'UTC'
}

tasks.register('integrationTest', Test) {
    description = 'Pruebas de integración contra MySQL y PostgreSQL reales.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    testLogging { events 'failed' }
    // TIMESTAMP(6) en vez de 'timestamptz' (V3__oauth.sql) sólo es exacto si la
    // JVM está en UTC. En el pod esa condición la instalan JAVA_TOOL_OPTIONS y
    // TZ (kubernetes/deployment.yaml), y en local bootRun (arriba); aquí se fija
    // para que esta suite -la que valida el porte entre motores- corra bajo la
    // misma condición que asume el esquema.
    systemProperty 'user.timezone', 'UTC'
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

bootJar {
    archiveBaseName = 'ma-authorization'
    // src/main/resources/dev-keys/active.jwk es una clave RSA privada completa,
    // de desarrollo. Lo único que hoy impide que un pod de producción firme con
    // una clave conocida públicamente es que el perfil 'dev' también apunta el
    // datasource a localhost -fail-closed por accidente, no por diseño-, así
    // que no tiene sentido empaquetarla en el artefacto que se despliega.
    exclude 'dev-keys/**'
}
