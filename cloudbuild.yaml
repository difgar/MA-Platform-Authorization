# Solo construye y sube la imagen. El despliegue lo hace terraform (terraform/servicio.tf)
# con la imagen fijada por DIGEST en terraform/imagenes.auto.tfvars: Cloud Run desde el
# 2026-10-03, ya no GKE (gke-deploy). Sin triggers, a proposito (sin CI por ahora): se
# lanza con scripts/construir-imagen.sh, que pasa _IMAGE.
#
# Sin tests aqui, igual que antes: la suite corre en local antes de construir.
substitutions:
  _IMAGE: ''
steps:
  # El Dockerfile copia build/libs/ma-authorization*.jar: hay que construirlo antes.
  - name: gradle:jdk25
    entrypoint: ./gradlew
    args: [--no-daemon, -q, bootJar]
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_IMAGE}', .]
images: ['${_IMAGE}']
options:
  machineType: E2_HIGHCPU_8
  logging: GCS_ONLY
timeout: 1800s
