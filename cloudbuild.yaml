steps:
  # 'gradle check' incluye 'integrationTest', que levanta contenedores con
  # Testcontainers (MySQL y PostgreSQL). No hay forma de comprobar desde aquí
  # si el *builder* de este proyecto en Cloud Build puede hacer Docker dentro
  # de Docker, así que este paso corre solo 'test' (unidad) para no asumirlo.
  # 'integrationTest' necesita wiring aparte: un trigger propio con un runner
  # que sí tenga Docker disponible (o el patrón "Docker outside of Docker" con
  # el socket montado, si ese es el caso de este proyecto de Cloud Build;
  # compruébalo antes del primer despliegue en vez de suponerlo).
  - name: 'gradle:jdk25'
    entrypoint: 'gradle'
    args: ['test']
    id: Test
  - name: 'gradle:jdk25'
    entrypoint: 'gradle'
    args: ['bootJar','-Denv=${_ENVIRONMENT}']
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '$_IMAGE_NAME'
      - '-t'
      - '$_IMAGE_NAME:${TAG_NAME}'
      - .
      - '-f'
      - $_DOCKERFILE_NAME
    dir: $_DOCKERFILE_DIR
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - '$_IMAGE_NAME'
    id: Push
  - name: gcr.io/cloud-builders/gke-deploy
    args:
      - prepare
      - '--filename=$_K8S_YAML_PATH'
      - '--image=$_IMAGE_NAME:${TAG_NAME}'
      - '--app=$_K8S_APP_NAME'
      - '--version=${TAG_NAME}'
      - '--namespace=$_K8S_NAMESPACE'
      - '--label=$_K8S_LABELS'
      - '--annotation=$_K8S_ANNOTATIONS,gcb-build-id=$BUILD_ID,gcb-commit=$COMMIT_SHA'
      - '--create-application-cr'
      - >-
        --links="Build
        details=https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
      - '--output=output'
    id: Prepare deploy
  - name: gcr.io/cloud-builders/gsutil
    args:
      - '-c'
      - |-
        if [ "$_OUTPUT_BUCKET_PATH" != "" ]
        then
          gsutil cp -r output/suggested gs://$_OUTPUT_BUCKET_PATH/config/$_K8S_APP_NAME/$BUILD_ID/suggested
          gsutil cp -r output/expanded gs://$_OUTPUT_BUCKET_PATH/config/$_K8S_APP_NAME/$BUILD_ID/expanded
        fi
    id: Save configs
    entrypoint: sh
  - name: gcr.io/cloud-builders/gke-deploy
    args:
      - apply
      - '--filename=output/expanded'
      - '--cluster=$_GKE_CLUSTER'
      - '--location=$_GKE_LOCATION'
      - '--namespace=$_K8S_NAMESPACE'
    id: Apply deploy
images:
  - '$_IMAGE_NAME'
  - '$_IMAGE_NAME:${TAG_NAME}'
options:
  substitutionOption: ALLOW_LOOSE
substitutions:
  _OUTPUT_BUCKET_PATH: sms-ma-platform_cloudbuild/deploy
  _DOCKERFILE_NAME: Dockerfile
  _K8S_NAMESPACE: default
  _K8S_YAML_PATH: kubernetes/
  _GKE_LOCATION: us-east1-c
  _GKE_CLUSTER: ma-platform-cluster-prod
  _K8S_LABELS: ''
  _K8S_ANNOTATIONS: ''
  _K8S_APP_NAME: ma-authorization-prod-deployment
  _IMAGE_NAME: us-east1-docker.pkg.dev/sms-ma-platform/ma-platform/ma-authorization
  _DOCKERFILE_DIR: ''
tags:
  - gcp-cloud-build-deploy
  - $_K8S_APP_NAME
