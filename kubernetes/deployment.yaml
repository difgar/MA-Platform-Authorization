---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "ma-authorization-prod-deployment-config"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
data:
  ENVIRONMENT: "production"
  SERVER_PORT: "8081"
  MANAGEMENT_SERVER_PORT: "18081"
  DB_MA_PLATFORM_URL: "jdbc:mysql://ma-platform-db.private.mobile-americas.com:3306/ma_platform_auth"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "ma-authorization-prod-deployment"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "ma-authorization"
  template:
    metadata:
      labels:
        app: "ma-authorization"
        env: "prod"
    spec:
      nodeSelector:
        app: "ma-platform-entry"
        env: "prod"
      terminationGracePeriodSeconds: 60
      containers:
        - name: "ma-authorization"
          image: "gcr.io/sms-ma-platform/ma-authorization"
          ports:
            - name: "http"
              containerPort: 8081
            - name: "management"
              containerPort: 18081
          resources:
            requests:
              memory: "288Mi"
              cpu: "100m"
            limits:
              # sin limits.cpu a proposito: provocaria throttling en el arranque
              memory: "490Mi"
          env:
            - name: "JAVA_TOOL_OPTIONS"
              value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"
            - name: "JWT_KEY_LOCATIONS"
              value: "file:/etc/ma-auth/keys/active.jwk"
            # ADMIN_CLIENT_ID, FGF_CLIENT_ID y AUTH_SECRET ya no existen: el
            # mapeo cliente de Google -> app vive en auth_app.google_client_id
            # (ver V2__datos_iniciales.sql), no en variables de entorno.
            - name: "env"
              valueFrom:
                configMapKeyRef:
                  key: "ENVIRONMENT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "SERVER_PORT"
              valueFrom:
                configMapKeyRef:
                  key: "SERVER_PORT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "MANAGEMENT_SERVER_PORT"
              valueFrom:
                configMapKeyRef:
                  key: "MANAGEMENT_SERVER_PORT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "DB_MA_PLATFORM_USER"
              valueFrom:
                secretKeyRef:
                  key: "user"
                  name: "ma-platform-db"
            - name: "DB_MA_PLATFORM_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: "password"
                  name: "ma-platform-db"
            - name: "DB_MA_PLATFORM_URL"
              valueFrom:
                configMapKeyRef:
                  key: "DB_MA_PLATFORM_URL"
                  name: "ma-authorization-prod-deployment-config"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/ma-auth/keys
              readOnly: true
          startupProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: "management"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: "management"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # No existía ninguna: Kubernetes no reiniciaba nunca un pod colgado.
          # startupProbe ya cubre el arranque lento (migraciones de Flyway), así
          # que esta no necesita un initialDelaySeconds generoso propio.
          livenessProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: "management"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            # Patrón de la plataforma (igual que MA-MtSender): Secret de
            # Kubernetes montado como volumen, sembrado desde Secret Manager en
            # Cloud Build. NO el CSI driver de Secret Manager: nadie más en
            # esta plataforma lo usa. Paso manual fuera de este repo: generar
            # el par de claves y `kubectl create secret generic
            # ma-auth-jwt-keys --from-file=active.jwk=./active.jwk`.
            secretName: ma-auth-jwt-keys
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "ma-authorization-prod-deployment-hpa"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "ma-authorization-prod-deployment"
    apiVersion: "apps/v1"
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: "Resource"
      resource:
        name: "cpu"
        target:
          type: Utilization
          averageUtilization: 80