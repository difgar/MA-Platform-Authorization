---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "ma-authorization-prod-deployment-config"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
data:
  ENVIRONMENT: "production"
  SERVER_PORT: "8081"
  MANAGEMENT_SERVER_PORT: "18081"
  # 'ma_auth' es un esquema NUEVO y vacío, distinto de 'ma_platform_auth' (el
  # que poblaba el servicio antiguo con generate-ddl:true, y del que salió el
  # volcado de V2__datos_iniciales.sql). Flyway aborta si el esquema no está
  # vacío y no tiene flyway_schema_history: apuntar aquí al esquema viejo
  # tumbaba el primer despliegue. baseline-on-migrate NO se activa a propósito
  # (ver README.md, sección Despliegue): saltaría V1 en silencio y dejaría la
  # app corriendo contra las tablas viejas.
  #
  # Los parámetros de zona NO son cosmética. Los TIMESTAMP(6) de V3__oauth.sql
  # (caducidad del código, del access token, del ID token, de la sesión) no
  # llevan zona: el driver de MySQL los convierte usando la zona de la sesión de
  # base de datos, que por defecto es la del servidor. Con la JVM en UTC y el
  # servidor en otra zona, lo que se escribe y lo que se lee se desplazan entre
  # sí y las caducidades dejan de ser las que se calcularon.
  #   preserveInstants=true               conserva el instante en las conversiones
  #   connectionTimeZone=UTC              la zona con la que convierte el driver
  #   forceConnectionTimeZoneToSession    se la impone también a la sesión MySQL
  # La otra mitad del anclaje son TZ y -Duser.timezone=UTC, más abajo. Las dos
  # mitades hacen falta: ni la JVM sola ni la conexión sola bastan.
  DB_MA_PLATFORM_URL: "jdbc:mysql://ma-platform-db.private.mobile-americas.com:3306/ma_auth?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
  # El 'iss' de los tokens y la base del documento de descubrimiento. Sin esta
  # variable, Spring Authorization Server lo deriva de la petición entrante y
  # detrás del ingress eso es http://<ip-del-pod>:8081/authorization-api: todo
  # consumidor que valide el emisor rechazaría los tokens. Incluye el
  # context-path porque los endpoints cuelgan de él.
  AUTH_ISSUER: "https://auth.mobile-americas.com/authorization-api"
  # Los orígenes desde los que el navegador canjea el código con
  # POST /oauth2/token. Lista exacta, no el comodín que trae application.yml por
  # defecto: con Access-Control-Allow-Credentials: true, *.mobile-americas.com
  # es cualquier subdominio del dominio, presente o futuro.
  #
  # Una aplicación nueva necesita DOS cosas, no una: su fila en auth_app con
  # redirect_uris, y su origen AQUÍ. Olvidar la segunda no deja rastro en
  # ningún log de este servidor -el navegador corta la petición antes de
  # enviarla-, y es el fallo más caro de diagnosticar de todo el rediseño.
  CORS_ALLOWED_ORIGINS: "https://admin.mobile-americas.com,https://fgf.mobile-americas.com"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "ma-authorization-prod-deployment"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "ma-authorization"
  template:
    metadata:
      labels:
        app: "ma-authorization"
        env: "prod"
    spec:
      nodeSelector:
        app: "ma-platform-entry"
        env: "prod"
      terminationGracePeriodSeconds: 60
      containers:
        - name: "ma-authorization"
          # gke-deploy --image (cloudbuild.yaml) sobreescribe esto en cada
          # despliegue real; se mantiene coherente con _IMAGE_NAME de
          # cloudbuild.yaml (Artifact Registry) para no dejar la única
          # referencia viva al registro de gcr.io ya retirado.
          image: "us-east1-docker.pkg.dev/sms-ma-platform/ma-platform/ma-authorization"
          ports:
            - name: "http"
              containerPort: 8081
            - name: "management"
              containerPort: 18081
          resources:
            requests:
              memory: "288Mi"
              cpu: "100m"
            limits:
              # sin limits.cpu a proposito: provocaria throttling en el arranque
              memory: "490Mi"
          env:
            # -Duser.timezone=UTC: la mitad de JVM del anclaje a UTC que hace
            # correctos los TIMESTAMP(6) sin zona de V3__oauth.sql. La otra
            # mitad son los parámetros de zona de DB_MA_PLATFORM_URL (arriba).
            - name: "JAVA_TOOL_OPTIONS"
              value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25 -Duser.timezone=UTC"
            # TZ además de -Duser.timezone: fija la zona del CONTENEDOR, que es
            # de donde la JVM tomaría la suya si alguien quitara el -D, y la que
            # ven las marcas de tiempo de los logs. Con las dos, la zona deja de
            # depender de la imagen base ni del nodo.
            - name: "TZ"
              value: "UTC"
            - name: "JWT_KEY_LOCATIONS"
              value: "file:/etc/ma-auth/keys/active.jwk"
            # ADMIN_CLIENT_ID, FGF_CLIENT_ID y AUTH_SECRET ya no existen. Desde
            # la fase 2 tampoco existe auth_app.google_client_id (la borró
            # V3__oauth.sql): hay UN SOLO cliente de Google para todo el
            # servicio, el de auth, y la aplicación se deduce del client_id
            # OAuth de la petición a /oauth2/authorize, no del 'aud' del token
            # de Google. De ahí las dos variables de abajo.
            #
            # Paso manual fuera de este repo: crear el Secret con el cliente
            # OAuth Web de Google Cloud, p. ej.
            #   kubectl create secret generic ma-auth-google-client \
            #     --from-literal=client-id=... --from-literal=client-secret=...
            - name: "GOOGLE_CLIENT_ID"
              valueFrom:
                secretKeyRef:
                  key: "client-id"
                  name: "ma-auth-google-client"
            - name: "GOOGLE_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  key: "client-secret"
                  name: "ma-auth-google-client"
            - name: "AUTH_ISSUER"
              valueFrom:
                configMapKeyRef:
                  key: "AUTH_ISSUER"
                  name: "ma-authorization-prod-deployment-config"
            - name: "CORS_ALLOWED_ORIGINS"
              valueFrom:
                configMapKeyRef:
                  key: "CORS_ALLOWED_ORIGINS"
                  name: "ma-authorization-prod-deployment-config"
            - name: "env"
              valueFrom:
                configMapKeyRef:
                  key: "ENVIRONMENT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "SERVER_PORT"
              valueFrom:
                configMapKeyRef:
                  key: "SERVER_PORT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "MANAGEMENT_SERVER_PORT"
              valueFrom:
                configMapKeyRef:
                  key: "MANAGEMENT_SERVER_PORT"
                  name: "ma-authorization-prod-deployment-config"
            - name: "DB_MA_PLATFORM_USER"
              valueFrom:
                secretKeyRef:
                  key: "user"
                  name: "ma-platform-db"
            - name: "DB_MA_PLATFORM_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: "password"
                  name: "ma-platform-db"
            - name: "DB_MA_PLATFORM_URL"
              valueFrom:
                configMapKeyRef:
                  key: "DB_MA_PLATFORM_URL"
                  name: "ma-authorization-prod-deployment-config"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/ma-auth/keys
              readOnly: true
          startupProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: "management"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: "/actuator/health/readiness"
              port: "management"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # No existía ninguna: Kubernetes no reiniciaba nunca un pod colgado.
          # startupProbe ya cubre el arranque lento (migraciones de Flyway), así
          # que esta no necesita un initialDelaySeconds generoso propio.
          livenessProbe:
            httpGet:
              path: "/actuator/health/liveness"
              port: "management"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            # Patrón de la plataforma (igual que MA-MtSender): Secret de
            # Kubernetes montado como volumen, sembrado desde Secret Manager en
            # Cloud Build. NO el CSI driver de Secret Manager: nadie más en
            # esta plataforma lo usa. Paso manual fuera de este repo: generar
            # el par de claves y `kubectl create secret generic
            # ma-auth-jwt-keys --from-file=active.jwk=./active.jwk`.
            secretName: ma-auth-jwt-keys
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "ma-authorization-prod-deployment-hpa"
  namespace: "default"
  labels:
    app: "ma-authorization"
    env: "prod"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "ma-authorization-prod-deployment"
    apiVersion: "apps/v1"
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: "Resource"
      resource:
        name: "cpu"
        target:
          type: Utilization
          averageUtilization: 80