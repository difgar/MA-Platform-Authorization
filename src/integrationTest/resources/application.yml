spring:
  security:
    oauth2:
      authorizationserver:
        # El authorization server exige un RegisteredClientRepository para
        # arrancar: sin ningún cliente declarado no hay bean y el contexto
        # falla con NoSuchBeanDefinitionException. Este cliente en memoria es
        # andamiaje SOLO de pruebas, y solo hasta que auth_app sea el registro
        # real de clientes. Público (client-authentication-methods: none) y con
        # PKCE obligatorio, que es la forma que tendrá cada aplicación.
        client:
          pruebas:
            require-proof-key: true
            require-authorization-consent: false
            registration:
              client-id: cliente-de-pruebas
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
              redirect-uris:
                - https://localhost/callback
              scopes:
                - openid
  jpa:
    # Flyway manda; 'validate' convierte la coherencia entre las entidades JPA
    # y el esquema real (en ambos motores) en algo que hace fallar el build,
    # no solo en algo cierto en producción por casualidad.
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Este fichero de test REEMPLAZA classpath:application.yml en vez de
    # fusionarse con él (mismo nombre de recurso, resuelto una sola vez): por
    # eso 'hibernate.ddl-auto' y 'flyway.enabled', arriba y aquí, ya estaban
    # repetidos antes de esta tarea. 'locations' necesita el mismo trato, o
    # las pruebas de integración correrían con el valor por defecto de Boot
    # (classpath:db/migration) y jamás aplicarían V4. Ver application.yml
    # principal para la razón de por qué la segunda ubicación no cuelga de
    # db/migration/{vendor}.
    locations: classpath:db/migration,classpath:db/migration-vendor/{vendor}

authorization:
  jwt:
    issuer: https://auth.mobile-americas.com
    # SOLO PARA TESTS: 'test-keys/active.jwk' está deliberadamente commiteado
    # en el repositorio. No es la clave de ningún entorno real; sirve
    # únicamente para que el contexto de Spring arranque en las pruebas
    # de integración.
    key-locations:
      - classpath:test-keys/active.jwk
  cors:
    # CorsProperties la lee vía @ConfigurationProperties (como JwtProperties.
    # key-locations, cuatro líneas más arriba), que admite tanto esta secuencia
    # YAML como una variable de entorno separada por comas en Kubernetes. Dos
    # orígenes a propósito, no uno: con un solo valor ninguna prueba distingue
    # "la lista se separó bien" de "no se separó y quedó un único patrón
    # inválido", que es justo el fallo silencioso que preocupaba en producción.
    allowed-origins:
      - https://localhost
      - https://admin.mobile-americas.com
