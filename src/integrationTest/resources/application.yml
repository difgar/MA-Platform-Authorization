spring:
  jpa:
    hibernate.ddl-auto: none   # Flyway manda; Hibernate ni siquiera valida
    open-in-view: false
  flyway:
    enabled: true

authorization:
  jwt:
    issuer: https://auth.mobile-americas.com
    # SOLO PARA TESTS: 'test-keys/active.jwk' está deliberadamente commiteado
    # en el repositorio. No es la clave de ningún entorno real; sirve
    # únicamente para que el contexto de Spring arranque en las pruebas
    # de integración.
    key-locations:
      - classpath:test-keys/active.jwk
  cors:
    # SecurityConfig la lee con @Value en un List<String>: eso solo resuelve
    # si la propiedad es un escalar (una cadena separada por comas), NO una
    # secuencia YAML con guiones. Una secuencia YAML se aplana en claves
    # indexadas (allowed-origins[0], [1]...) y no existe ningún valor en la
    # clave "authorization.cors.allowed-origins" sin índice, así que
    # ${authorization.cors.allowed-origins} no resuelve y el contexto no
    # arranca (PlaceholderResolutionException). El formato escalar es además
    # el que encaja con una variable de entorno de Kubernetes.
    allowed-origins: https://localhost
