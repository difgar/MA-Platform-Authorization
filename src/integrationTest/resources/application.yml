spring:
  # El authorization server exige un RegisteredClientRepository para arrancar:
  # sin ningún cliente ni bean propio, el contexto falla con
  # NoSuchBeanDefinitionException. Hasta la tarea 4 este bloque declaraba un
  # cliente en memoria SOLO de pruebas para cubrir ese requisito; desde que
  # RegisteredClientRepositoryAdapter existe (auth_app ES el registro real de
  # clientes), ese andamiaje sobra: el bean propio ya satisface el arranque, y
  # dejarlo aquí sería justo la clase de segundo registro que esta fase quita.
  jpa:
    # Flyway manda; 'validate' convierte la coherencia entre las entidades JPA
    # y el esquema real (en ambos motores) en algo que hace fallar el build,
    # no solo en algo cierto en producción por casualidad.
    hibernate.ddl-auto: validate
    open-in-view: false
  # Repetido desde application.yml por el mismo motivo que 'flyway.locations'
  # (ver el comentario de abajo): este fichero REEMPLAZA al principal, no se
  # fusiona con él. Sin estas líneas la sesión se quedaría en memoria de Tomcat
  # y SPRING_SESSION seguiría vacía, que es justo lo que LoginIT verifica.
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never      # las tablas las crea Flyway
      # '-' es Scheduled.CRON_DISABLED, y SÓLO en pruebas. La limpieza de
      # sesiones caducadas corre en su propio hilo (spring-session-N) contra
      # la base de datos, y al cerrar cada contexto se cruza con el cierre de
      # Hikari: aparece un ERROR "Failed to release JPA EntityManager"
      # intermitente que no es un fallo de nada y que tapa el ruido que sí
      # importaría mirar. En producción la limpieza se queda con su valor por
      # defecto (cada minuto): es lo único que contiene el crecimiento de
      # SPRING_SESSION.
      cleanup-cron: "-"
  security.oauth2.client.registration.google:
    # SOLO PARA TESTS, y sin ningún valor que haya que hacer coincidir con
    # nada: el proveedor simulado no valida el secreto, y la audiencia del ID
    # token es el client_id que viajó en la petición de autorización.
    client-id: cliente-de-pruebas
    client-secret: secreto-de-pruebas
    scope: openid,email,profile
    # El proveedor (provider.google.issuer-uri) NO se declara aquí: se resuelve
    # al construir el contexto descargando el documento de descubrimiento, y el
    # puerto del simulado no se conoce hasta arrancarlo. Lo registra
    # BaseOauthIT con @DynamicPropertySource. Las pruebas que no extienden esa
    # clase base se quedan con los endpoints reales de Google
    # (CommonOAuth2Provider), que nunca llegan a llamarse: ninguna sigue la
    # redirección al proveedor.
  flyway:
    enabled: true
    # Este fichero de test REEMPLAZA classpath:application.yml en vez de
    # fusionarse con él (mismo nombre de recurso, resuelto una sola vez): por
    # eso 'hibernate.ddl-auto' y 'flyway.enabled', arriba y aquí, ya estaban
    # repetidos antes de esta tarea. 'locations' necesita el mismo trato, o
    # las pruebas de integración correrían con el valor por defecto de Boot
    # (classpath:db/migration) y jamás aplicarían V4. Ver application.yml
    # principal para la razón de por qué la segunda ubicación no cuelga de
    # db/migration/{vendor}.
    locations: classpath:db/migration,classpath:db/migration-vendor/{vendor}

authorization:
  jwt:
    issuer: https://auth.mobile-americas.com
    # SOLO PARA TESTS: 'test-keys/active.jwk' está deliberadamente commiteado
    # en el repositorio. No es la clave de ningún entorno real; sirve
    # únicamente para que el contexto de Spring arranque en las pruebas
    # de integración.
    key-locations:
      - classpath:test-keys/active.jwk
  cors:
    # CorsProperties la lee vía @ConfigurationProperties (como JwtProperties.
    # key-locations, cuatro líneas más arriba), que admite tanto esta secuencia
    # YAML como una variable de entorno separada por comas en Kubernetes. Dos
    # orígenes a propósito, no uno: con un solo valor ninguna prueba distingue
    # "la lista se separó bien" de "no se separó y quedó un único patrón
    # inválido", que es justo el fallo silencioso que preocupaba en producción.
    allowed-origins:
      - https://localhost
      - https://admin.mobile-americas.com
