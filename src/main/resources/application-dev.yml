server:
  # 18081 en local a pedido del equipo. OJO: 18081 es el puerto de management en
  # el resto de los perfiles, así que aquí management se mueve a 28081 para no
  # colisionar. La API queda en http://localhost:18081/authorization-api
  port: 18081

management:
  server.port: 28081

spring:
  datasource:
    # PostgreSQL en local, no MySQL: producción migra a Postgres y el entorno de
    # desarrollo debe parecerse a donde se va, no a donde se viene. Las
    # migraciones son las mismas para ambos motores -es el objetivo del diseño-
    # y la suite de integración sigue probando los dos.
    #
    # La base de datos debe estar VACÍA la primera vez: Flyway aborta ante un
    # esquema no vacío sin tabla de historia, para no correr contra tablas ajenas.
    #
    # Sin parámetros de zona horaria, a diferencia de la URL de MySQL de
    # kubernetes/deployment.yaml: el driver de PostgreSQL ya manda y lee los
    # 'timestamp' sin zona en la zona de la JVM sin reinterpretarlos, así que
    # con -Duser.timezone=UTC en la JVM basta. El de MySQL no. Esa JVM en local
    # la ancla bootRun (build.gradle); en el pod, JAVA_TOOL_OPTIONS y TZ
    # (kubernetes/deployment.yaml).
    url: jdbc:postgresql://localhost:5432/ma_auth
    username: ma_auth
    password: ma_auth
  security.oauth2.authorizationserver:
    # El emisor local, con el puerto y el context-path de este perfil. Si se
    # dejara el valor de application.yml, el documento de descubrimiento
    # anunciaría https://auth.mobile-americas.com/... contra un servidor que
    # corre en localhost, y los tokens saldrían con el 'iss' de producción.
    issuer: http://localhost:18081/authorization-api
  security.oauth2.client.registration.google:
    # Valores por defecto SOLO para que el contexto arranque sin exportar nada:
    # en application.yml estas dos propiedades no tienen default y su
    # placeholder sin resolver aborta el arranque, así que ni siquiera se podía
    # levantar el servicio en local para mirar el documento de descubrimiento.
    #
    # Con estos valores NO se puede iniciar sesión: Google rechaza el cliente.
    # Para probar el login de verdad hay que exportar GOOGLE_CLIENT_ID y
    # GOOGLE_CLIENT_SECRET del cliente OAuth Web real, que además necesita
    # http://localhost:18081/authorization-api/login/oauth2/code/google entre
    # sus URI de redirección autorizadas.
    client-id: ${GOOGLE_CLIENT_ID:sin-configurar.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:sin-configurar}
    # La de este perfil, con su puerto y su context path. Tiene que estar
    # registrada tal cual en el cliente OAuth Web de Google para poder probar
    # el login en local.
    redirect-uri: http://localhost:18081/authorization-api/login/oauth2/code/google

authorization:
  jwt:
    # dev-keys/active.jwk se genera con RSAKeyGenerator (nimbus-jose-jwt) y se
    # commitea SOLO porque es de desarrollo: no protege nada real, nunca sale
    # de este perfil y no debe reutilizarse en ningún entorno desplegado. En
    # todos los demás perfiles, JWT_KEY_LOCATIONS (ver application.yml) la
    # sobrescribe con la ruta del Secret montado en el pod. bootJar la excluye
    # del artefacto, así que no viaja a producción ni por accidente.
    key-locations: classpath:dev-keys/active.jwk
  cors:
    # Los orígenes locales de los paneles. 5173 es el de por defecto de Vite
    # (MA-Platform-UI no fija server.port en su vite.config.ts, confirmado
    # contra su repositorio el 2026-09-18); 3000 es el del arranque anterior.
    # 5174 es el de TrafficFlow: su vite.config.ts fija port: 5174 con
    # strictPort: true. Sin el origen aquí, el POST /oauth2/token de la SPA lo
    # corta el navegador y en este servidor no queda ni una línea de log.
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174
